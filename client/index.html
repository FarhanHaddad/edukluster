<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/src/assets/widuri.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>EduCluster SMA Widuri</title>
    <script>
      // Terapkan tema tersimpan sebelum React mount agar tidak ada flash.
      (function () {
        try {
          var t = localStorage.getItem('edukluster.theme');
          if (t === 'dark' || (!t && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
            document.documentElement.classList.add('dark');
          }
        } catch (e) {
          /* noop */
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
